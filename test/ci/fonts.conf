<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Playwright's deps pull GNU Unifont / FreeFont, which fontconfig then prefers for emoji: reject them. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*/unifont/*</glob>
      <glob>*/freefont/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
